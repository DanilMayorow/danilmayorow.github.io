  <select data-bd="${b.id}"${days.length?"":" disabled"}><option value="">${days.length?"— назначить на день —":"Задайте даты поездки"}</option>${days.map(k=>`<option value="${k}"${k===b.date?" selected":""}>${new Date(k+"T00:00").toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})} ${isWE(k)?"🏠":"🏫"}</option>`).join("")}</select></div>`}
function blocksUI(){
  const days=dayList(),bl=S.blocks.filter(b=>b.st!=="skip"&&b.items.some(okI)),m=bl.filter(b=>!bAlt(b)),nw=m.filter(b=>b.type==="we").length,nd=m.length-nw;
  let h=`<div class="row" style="margin:8px 0 4px"><b>🧩 Мини-туры${bl.length?` (${bl.length})`:""}</b><span><button data-a="tnew">➕ Свой тур</button> <button data-a="bt">${S.bo===false?"▾":"▴"}</button></span></div>`;
  if(S.bo===false)return h;
  if(!bl.length)return h+`<div class="leg">Туров пока нет. Нажмите «🧩 Туры» вверху.</div>`;
  h+=`<div class="leg" style="padding:0 0 4px">Основных туров: ${nd} будних + ${nw} выходных · дней: ${S.cfg.wd} будних, ${S.cfg.we} выходных. Тап по туру — править состав и порядок, читать мини-историю.</div>`;
  if(S.cfg.we&&nw>S.cfg.we)h+=`<div class="wn">⚠ Длинных туров больше, чем выходных дней (${nw} > ${S.cfg.we})</div>`;
  return h+[...bl].sort((x,y)=>(x.date?1:0)-(y.date?1:0)||bAlt(x)-bAlt(y)).map(b=>blockCard(b,days)).join("")}
function plan(){
  const base=S.sel.map(i=>BY[i]),alts=S.alt.map(i=>BY[i]),a=admin();
  if(!base.length&&!alts.length)return `<div class="empty">Витрина пока пуста.<br>${a?"Вернитесь к отбору и выберите локации.":"Администратор ещё не опубликовал маршрут."}</div>`;
  const days=dayList();if(days.length&&!days.includes(S.day))S.day=days.includes(today)?today:days[0];
  const di=days.length?dayInfo(S.day):null,mi=di?di.it:[];let h="";
  h+=a?`<div class="card" style="padding:8px 12px;margin:0 0 8px"><div class="row"><b>🗓 Даты поездки</b><span><input type="date" data-t="s" value="${S.trip.start}"> — <input type="date" data-t="e" min="${S.trip.start}" value="${S.trip.end}"></span></div></div>`
    :(days.length?`<div style="margin-bottom:8px"><b>🗓 ${fd(new Date(S.trip.start+"T00:00"))} — ${fd(new Date(S.trip.end+"T00:00"))}</b></div>`:"");
  if(a)h+=blocksUI();
  if(days.length){
    h+=`<div class="chips">${days.map(k=>{const n=dayInfo(k),on=k===S.day;return `<button data-a="day" data-v="${k}" class="${on?"on":""}">${new Date(k+"T00:00").toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})} · ${n.it.length}${n.w.some(w=>w[0]==="⚠")?" ⚠":""}</button>`}).join("")}</div>`;
    h+=`<div class="card" style="padding:8px 12px;margin:0 0 6px"><b>${fd(new Date(S.day+"T00:00"))}</b><div class="meta"><span>${di.o.ic} старт: ${di.o.n} ${hm(di.st)}</span><span>🕐 возврат ≈ ${hm(di.end)}</span><span>💴 ${yen(di.cost)}</span><span>⏱ посещения ${hrs(+di.hv.toFixed(1))}</span><span>🚆 в пути ≈ ${mins(di.tr)}</span></div>${di.w.map(w=>`<div class="wn">${w}</div>`).join("")}</div>`;
  }
  if(days.length&&mi.length){
    const gm="https://www.google.com/maps/dir/"+[di.o.q,...mi.map(x=>x[7]+","+x[8])].join("/");
    h+=`<a class="rt" href="${gm}" target="_blank" rel="noopener">🗺 Открыть маршрут дня в Google Maps ↗</a><div class="leg" style="text-align:center">Остановки идут в заданном порядке, старт — ${di.o.n}</div>`;
  }
  if(days.length){
    if(!di.it.length)h+=`<div class="empty" style="padding:14px">На этот день пока ничего не запланировано${a?". Откройте карточку локации ниже и выберите дату.":"."}</div>`;
    di.it.forEach((x,i)=>{h+=`<div class="leg">${i?`↓ ≈ ${leg(di.it[i-1],x)} мин`:`${di.o.ic} от точки старта: ${di.o.n} · ${mins(dep(x,di.o.home))}`}</div>`+card(x,i+1,false,a&&di.it.length>1)});
    if(di.it.length)h+=`<div class="leg">${di.o.ic} обратно: ${di.o.n} ≈ ${mins(dep(di.it[di.it.length-1],di.o.home))}</div>`;
  }
  const un=base.filter(x=>!days.length||!days.includes(S.dates[x[0]])),cats=["Все",...new Set([...un,...alts].map(x=>x[3]))];
  const f=cats.includes(S.filter)?S.filter:"Все",fl=q=>f==="Все"?q:q.filter(x=>x[3]===f),u2=fl(un),al=fl(alts);
  if(un.length||alts.length)h+=`<div class="chips" style="margin-top:8px">${cats.map(c=>`<button data-a="f" data-v="${c}" class="${c===f?"on":""}">${CAT[c]||""} ${c}</button>`).join("")}</div>`;
  if(a)h+=orphNote();
  if(un.length)h+=`<h2 class="sec" style="margin-top:0">${days.length?"📋 Не распределено":"📋 Выбранные локации"} (${un.length})</h2>`+u2.map((x,i)=>card(x,i+1,false,false)).join("");
  if(al.length)h+=`<h2 class="sec">🔖 Альтернативы (${al.length})</h2>`+al.map(x=>card(x,0,true)).join("");
  return h;
}

function swipe(){
  const q=undecided(),x=q[0];
  if(!x)return `<div class="empty">Все карточки просмотрены.<br>В плане: ${S.sel.length} · альтернатив: ${S.alt.length}<br><br>${S.skip.length?`<button data-a="reskip">♻ Вернуть пропущенные (${S.skip.length})</button> `:""}<button class="p" data-a="finish">Далее →</button></div>`;
  return `<div class="row"><span class="badge">${L.length-q.length} / ${L.length}</span><span class="badge">В плане: ${S.sel.length} · Альтернатив: ${S.alt.length}</span></div>
  <div class="stack"><div class="card" id="card"><div class="emo">${CAT[x[3]]}</div><div class="en">${x[1]}</div><div class="ja">${x[2]}</div>
  <div class="area">📍 ${ar(x)}</div><div style="text-align:center"><span class="chip">${x[3]}</span></div><p class="desc">${descOf(x)}</p><div style="text-align:center">${bkc(x)}</div>
  <div class="facts"><div><span>Стоимость</span><b>${yen(x[4])}</b></div><div><span>Длительность</span><b>${hrs(x[5])}</b></div><div><span>От ст. Синдзюку</span><b>${mins(x[6])}</b></div><div><span>Часы работы</span><b>${hrt(x)}</b></div></div></div></div>
  <div class="act"><button data-a="no"><b>✕</b><small>Пропуск</small></button><button data-a="undo"><b>↩</b><small>Назад</small></button><button data-a="alt"><b>🔖</b><small>Альтернатива</small></button><button data-a="yes" style="color:var(--ok)"><b>♥</b><small>В план</small></button></div>
  <div style="text-align:center;color:var(--mu);font-size:12px;margin-bottom:8px">Свайп: → в план · ← пропуск · ↑ альтернатива · тап — подробнее</div>
  <div class="row" style="justify-content:center"><button data-a="openadd">➕ Добавить место</button><button class="p" data-a="finish">Завершить отбор →</button></div>`;
}

function render(){
  const a=admin(),ph=a?S.phase:"plan";
  let h=`<header><h1>🗼 Токио и окрестности <small style="color:var(--mu);font-weight:400">v1.0</small></h1><div class="row" style="gap:6px"><span class="badge">${a?"Администратор":"Зритель"}</span>${S.isAdmin?`<button data-a="pv">${S.preview?"✏️ Редактор":"👁 Предпросмотр"}</button>`:""}${S.isAdmin&&!S.preview?`<button data-a="exp">📤 Витрина</button><button data-a="menu" aria-label="Управление">⚙️</button>`:""}</div></header>`;
  if(S.isAdmin&&!S.preview)h+=`<div class="leg" style="padding:0 0 6px">💾 Данные хранятся в этом браузере. Для гостей — «📤 Витрина» (файл только для просмотра), резервные копии — в ⚙️.</div>`;
  if(a&&ph==="plan")h+=`<div class="row" style="margin-bottom:8px"><button data-a="back">← К отбору</button><button data-a="toreview">📋 Список</button><button data-a="totours">🧩 Туры</button><button data-a="openadd">➕ Добавить место</button></div>`;
  h+=(ph==="swipe"?swipe():ph==="review"?review():ph==="tours"?tourSwipe():plan())+sheet();
  const y=window.scrollY,cs=document.querySelector(".chips"),cx=cs?cs.scrollLeft:0;document.getElementById("app").innerHTML=h;const c2=document.querySelector(".chips");if(c2)c2.scrollLeft=cx;window.scrollTo(0,y);
  bind();
}
function bind(){
  const c=document.getElementById("card");if(!c)return;let p=null;
  c.onpointerdown=e=>{if(e.target.closest("a,button"))return;p=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];c.style.transition="none";c.style.transform=`translate(${dx}px,${Math.min(dy,0)}px) rotate(${dx/20}deg)`};
  c.onpointerup=e=>{if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p=null;c.style.transition="";
    if(Math.abs(dx)<6&&Math.abs(dy)<6){if(S.phase==="tours"){S.tour=tUndec()[0].id;S.story=false}else{S.open=undecided()[0][0]}S.edit=false;render();return}
    if(dy<-90&&-dy>Math.abs(dx))act("alt");else if(Math.abs(dx)>90)act(dx>0?"main":"skip");else c.style.transform=""};
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;if(a==="close"&&b.classList.contains("ov")&&e.target!==b)return;
  if(a==="topen"&&e.target.closest("select"))return;
  if(a==="yes")act("main");else if(a==="no")act("skip");else if(a==="alt")act("alt");else if(a==="undo"){S.phase==="tours"?tundo():undo()}
  else if(a==="toreview"){S.phase="review";save();render()}else if(a==="totours"){if(S.blocks.some(b=>b.items.some(okI))){S.phase="tours";save();render()}else buildBlocks()}
  else if(a==="tfin"){S.phase="plan";save();render()}else if(a==="treset"){S.blocks.forEach(b=>b.st="");S.thist=[];save();render()}
  else if(a==="story"){S.tour=+v;S.story=true;render()}else if(a==="stog"){S.story=!S.story;render()}else if(a==="topen"){S.tour=+v;S.story=false;render()}
  else if(a==="tu"||a==="td"){const id=+v;tedit(b=>{const A=b.items,k=A.indexOf(id),j=a==="tu"?k-1:k+1;if(k>=0&&j>=0&&j<A.length)[A[k],A[j]]=[A[j],A[k]]})}
  else if(a==="tx"){const id=+v;tedit(b=>{b.items=b.items.filter(i=>i!==id);delete S.dates[id];const o=S.blocks.find(t=>t!==b&&t.st!=="skip"&&t.date&&t.items.includes(id));if(o)S.dates[id]=o.date})}
  else if(a==="ttype"){const b=S.blocks.find(t=>t.id===+v);if(b)ttoggle(b)}else if(a==="tauto"){const b=S.blocks.find(t=>t.id===+v);if(b)ttoggle(b,1)}else if(a==="tdup"){const b=S.blocks.find(t=>t.id===+v);if(b)tdup(b)}else if(a==="tsplit"){const b=S.blocks.find(t=>t.id===+v);if(b)tsplit(b)}else if(a==="tnew")tnew();
  else if(a==="topt")tedit(b=>{b.items=tourStat(b.items,b.type==="we"?1:0).o})
  else if(a==="tst"){const b=S.blocks.find(t=>t.id===S.tour);if(b){b.st=v;save();render()}}
  else if(a==="dyes"){const f=dlgFn;S.dlg=null;dlgFn=null;if(f)f();else render()}else if(a==="dno"){S.dlg=null;dlgFn=null;render()}else if(a==="reskip"){S.skip=[];S.phase="swipe";save();render()}else if(a==="finish"){S.phase="review";save();render()}
  else if(a==="back"){S.phase="swipe";save();render()}
  else if(a==="day"){S.day=v;render()}else if(a==="up"||a==="dn")mv(+v,a==="up"?-1:1);else if(a==="pv"){S.preview=!S.preview;S.edit=false;render()}else if(a==="open"){S.open=+v;S.edit=false;render()}else if(a==="close"){if(S.open&&S.tour){S.open=null;S.edit=false;render();return}S.open=null;S.add=null;S.menu=false;cleanT();S.tour=null;S.story=false;S.edit=false;render()}else if(a==="menu"){S.menu=true;render()}else if(a==="build")buildBlocks();else if(a==="csv")exportCsv();else if(a==="bt"){S.bo=S.bo===false;render()}else if(a==="bak")dl("tokyo-backup-"+iso(new Date())+".json",JSON.stringify(snap(),null,1),"application/json");else if(a==="unskip"){ask("Вернуть пропущенные карточки в стопку «Тиндера»?",()=>commit(d=>{d.skip=[];d.done=false;d.ph="swipe"}))}else if(a==="wipe"){ask("Удалить весь план и начать заново? Сначала лучше скачать резервную копию.",()=>{try{localStorage.removeItem("tokyo-v1")}catch(e){}location.reload()})}else if(a==="rst"){ask("Вернуть карточке исходные данные?",()=>commit(d=>{delete d.ed[v]}))}else if(a==="del"){ask("Удалить эту добавленную карточку совсем?",()=>commit(d=>{const id=+v,f=q=>q.filter(i=>i!==id);d.sel=f(d.sel);d.skip=f(d.skip);d.alt=f(d.alt);delete d.cu[id];delete d.ed[id];d.blocks.forEach(b=>b.items=f(b.items));delete d.dates[id];for(const k in d.ord)d.ord[k]=f(d.ord[k])}))}else if(a==="openadd"){S.menu=false;S.add={q:"",busy:false,res:null,err:""};render()}else if(a==="addman")addMan();else if(a==="search")doSearch();else if(a==="exp")exportShowcase();else if(a==="addcu")addCu();else if(a==="edit"){S.edit=true;render()}else if(a==="noedit"){S.edit=false;render()}else if(a==="saveEd"){const g=i=>document.getElementById(i).value;applyEd(S.open,{en:g("e_en"),ja:g("e_ja"),cat:g("e_cat"),yen:g("e_yen"),h:g("e_h"),min:g("e_min"),o:g("e_o"),c:g("e_c"),ar:g("e_ar"),desc:g("e_desc"),bk:[g("e_bl"),g("e_bt")]});S.blocks.forEach(fixB);S.edit=false;save();render()}
  else if(a==="f"){S.filter=v;render()}
  else if(a==="mk"){const id=+v;S.alt=S.alt.filter(i=>i!==id);S.sel.push(id);save();render()}else if(a==="pp"){const id=+v;S.sel=S.sel.filter(i=>i!==id);delete S.dates[id];S.alt.push(id);save();render()}else if(a==="rm"){const id=+v;S.open=null;S.alt=S.alt.filter(i=>i!==id);S.sel=S.sel.filter(i=>i!==id);delete S.dates[id];S.filter="Все";save();render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="imp"){importFile(e.target.files[0]);return}
  const hi=e.target.closest("input[data-h]");if(hi){setHours(+hi.dataset.h,hi.value);return}
  const cn=e.target.closest("input[data-c]");if(cn){S.cfg[cn.dataset.c]=Math.max(0,Math.min(31,Math.round(+cn.value||0)));save();return}
  const sa=e.target.closest("select[data-ba]");if(sa){const id=+sa.value;if(id)tedit(b=>{if(!b.items.includes(id))b.items.push(id)});return}
  const sb=e.target.closest("select[data-bd]");if(sb){const b=S.blocks.find(x=>x.id==sb.dataset.bd);if(b)assign(b,sb.value);return}
  const t=e.target.closest("input[data-t]");if(t){if(t.dataset.t==="s"){S.trip.start=t.value;if(!S.trip.end||S.trip.end<t.value)S.trip.end=t.value}else S.trip.end=t.value;save();render();return}
  const i=e.target.closest("input[data-id]");if(!i)return;
  if(i.value)S.dates[i.dataset.id]=i.value;else delete S.dates[i.dataset.id];save();render();
});
document.addEventListener("keydown",e=>{if(S.open||S.add||S.menu||S.tour){if(e.key==="Escape"){if(S.open&&S.tour){S.open=null;S.edit=false;render();return}S.open=null;S.add=null;S.menu=false;cleanT();S.tour=null;S.story=false;S.edit=false;render()}return}if(!admin()||(S.phase!=="swipe"&&S.phase!=="tours"))return;if(e.key==="ArrowRight")act("main");if(e.key==="ArrowLeft")act("skip");if(e.key==="ArrowUp")act("alt")});
init();
</script>
</body></html>
